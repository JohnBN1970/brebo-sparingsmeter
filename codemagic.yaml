workflows:
  sparingsmeter-ios:
    name: BREBO Sparingsmeter iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "BREBO Codemagic"

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.brebo.sparingsmeter
      vars:
        XCODE_PROJECT: "Sparingsmeter.xcodeproj"
        XCODE_SCHEME: "Sparingsmeter"
        BUNDLE_ID: "nl.brebo.sparingsmeter"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Show project settings
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings

      - name: Run simulator tests
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Apply Sparingsmeter signing profile
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build signed Sparingsmeter IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

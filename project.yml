name: Sparingsmeter
options:
  bundleIdPrefix: nl.brebo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
targets:
  Sparingsmeter:
    type: application
    platform: iOS
    sources:
      - Sparingsmeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.brebo.sparingsmeter
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: BREBO Sparingsmeter gebruikt de camera en LiDAR om sparingen automatisch in 3D te meten.
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: "arkit"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies: []
  SparingsmeterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SparingsmeterTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Sparingsmeter

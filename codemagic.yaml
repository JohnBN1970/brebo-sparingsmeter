workflows:
  sparingsmeter-ios:
    name: BREBO Sparingsmeter iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "Sparingsmeter.xcodeproj"
        XCODE_SCHEME: "Sparingsmeter"
        BUNDLE_ID: "nl.brebo.sparingsmeter"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Show project settings
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings

      - name: Run simulator tests
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device archive validation
        script: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Sparingsmeter.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

    artifacts:
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

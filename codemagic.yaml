workflows:
  sparingsmeter-ios:
    name: BREBO Sparingsmeter iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "BREBO Codemagic"

    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.brebo.sparingsmeter
      vars:
        XCODE_PROJECT: "Sparingsmeter.xcodeproj"
        XCODE_SCHEME: "Sparingsmeter"
        BUNDLE_ID: "nl.brebo.sparingsmeter"

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Sparingsmeter app icons
        script: |
          set -euo pipefail
          ICON_DIR="$CM_BUILD_DIR/Sparingsmeter/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path

          size = 1024
          bg = (18, 18, 18)
          fg = (245, 245, 245)
          margin = 180
          border = 64
          arm = 180
          cross = 42

          rows = []
          for y in range(size):
              row = bytearray()
              for x in range(size):
                  pixel = bg
                  in_outer = margin <= x < size-margin and margin <= y < size-margin
                  in_inner = margin+border <= x < size-margin-border and margin+border <= y < size-margin-border
                  frame = in_outer and not in_inner
                  center = size // 2
                  crosshair = (
                      (center-arm <= x <= center+arm and center-cross//2 <= y <= center+cross//2)
                      or
                      (center-cross//2 <= x <= center+cross//2 and center-arm <= y <= center+arm)
                  )
                  if frame or crosshair:
                      pixel = fg
                  row.extend(pixel)
              rows.append(b"\x00" + bytes(row))

          raw = b"".join(rows)

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )

          Path("Sparingsmeter/Assets.xcassets/AppIcon.appiconset/icon-1024.png").write_bytes(png)
          PY

          for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180; do
            sips -z "$SIZE" "$SIZE" "$ICON_DIR/icon-1024.png" --out "$ICON_DIR/icon-$SIZE.png" >/dev/null
          done

          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              {"idiom":"iphone","size":"20x20","scale":"2x","filename":"icon-40.png"},
              {"idiom":"iphone","size":"20x20","scale":"3x","filename":"icon-60.png"},
              {"idiom":"iphone","size":"29x29","scale":"2x","filename":"icon-58.png"},
              {"idiom":"iphone","size":"29x29","scale":"3x","filename":"icon-87.png"},
              {"idiom":"iphone","size":"40x40","scale":"2x","filename":"icon-80.png"},
              {"idiom":"iphone","size":"40x40","scale":"3x","filename":"icon-120.png"},
              {"idiom":"iphone","size":"60x60","scale":"2x","filename":"icon-120.png"},
              {"idiom":"iphone","size":"60x60","scale":"3x","filename":"icon-180.png"},

              {"idiom":"ipad","size":"20x20","scale":"1x","filename":"icon-20.png"},
              {"idiom":"ipad","size":"20x20","scale":"2x","filename":"icon-40.png"},
              {"idiom":"ipad","size":"29x29","scale":"1x","filename":"icon-29.png"},
              {"idiom":"ipad","size":"29x29","scale":"2x","filename":"icon-58.png"},
              {"idiom":"ipad","size":"40x40","scale":"1x","filename":"icon-40.png"},
              {"idiom":"ipad","size":"40x40","scale":"2x","filename":"icon-80.png"},
              {"idiom":"ipad","size":"76x76","scale":"1x","filename":"icon-76.png"},
              {"idiom":"ipad","size":"76x76","scale":"2x","filename":"icon-152.png"},
              {"idiom":"ipad","size":"83.5x83.5","scale":"2x","filename":"icon-167.png"},

              {"idiom":"ios-marketing","size":"1024x1024","scale":"1x","filename":"icon-1024.png"}
            ],
            "info": {"author":"xcode","version":1}
          }
          JSON

          mkdir -p "$CM_BUILD_DIR/Sparingsmeter/Assets.xcassets"
          cat > "$CM_BUILD_DIR/Sparingsmeter/Assets.xcassets/Contents.json" <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set Sparingsmeter build number
        script: |
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Show project settings
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -showBuildSettings

      - name: Run simulator tests
        script: |
          xcodebuild test \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Apply Sparingsmeter signing profile
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Build signed Sparingsmeter IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
